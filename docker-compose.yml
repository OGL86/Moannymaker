# To prosesser som deler samme database:
#   listener – lytter på PumpPortal-migrasjoner (kandidatkilde)
#   bot      – kjører strategiløkka
# Live: sett mode: live i config.yaml OG legg "--live" først i bot-kommandoen.
services:
  listener:
    build: .
    command: ["listen"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  bot:
    build: .
    command: ["run"]          # live: ["--live", "run"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      # - ./bot-wallet.json:/app/bot-wallet.json:ro   # live: og SOLANA_KEYPAIR_PATH=/app/bot-wallet.json
    restart: unless-stopped
    depends_on: [listener]

  copy:                          # kopitrading – krever PUMPPORTAL_API_KEY. Live: ["--live", "copy"]
    build: .
    command: ["copy"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    profiles: ["copy"]           # startes med: docker compose --profile copy up -d

  dashboard:
    build: .
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # kun tilgjengelig fra maskinen selv
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml   # skrivbar: innstillinger kan endres fra dashboardet
    restart: unless-stopped
